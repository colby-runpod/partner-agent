AWSTemplateFormatVersion: '2010-09-09'
Description: Separate database credentials and temporary bootstrap access for the partner agent
Parameters:
  AdminSecretArn:
    Type: String
  BootstrapAccess:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
Conditions:
  BootstrapEnabled: !Equals [!Ref BootstrapAccess, 'true']
Resources:
  RuntimeSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: team-partner-agent/pilot/database-runtime
      Description: Restricted database login; never administrator credentials
      GenerateSecretString:
        SecretStringTemplate: '{"username":"agent_runtime"}'
        GenerateStringKey: password
        PasswordLength: 40
        ExcludePunctuation: true
  MigrationSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: team-partner-agent/pilot/database-migrator
      Description: Schema migration login; never attach to the live agent
      GenerateSecretString:
        SecretStringTemplate: '{"username":"agent_migrator"}'
        GenerateStringKey: password
        PasswordLength: 40
        ExcludePunctuation: true
  BootstrapExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:*
      Policies:
        - PolicyName: BootstrapImageAndLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, ecr:BatchCheckLayerAvailability]
                Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/team-partner-agent
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/ecs/default/team-partner-agent-a223-9ff7:*
  BootstrapSecretPolicy:
    Type: AWS::IAM::Policy
    Condition: BootstrapEnabled
    Properties:
      PolicyName: TemporaryDatabaseBootstrap
      Roles: [!Ref BootstrapExecutionRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: [!Ref AdminSecretArn, !Ref RuntimeSecret, !Ref MigrationSecret]
Outputs:
  RuntimeSecretArn:
    Value: !Ref RuntimeSecret
  MigrationSecretArn:
    Value: !Ref MigrationSecret
  BootstrapExecutionRoleArn:
    Value: !GetAtt BootstrapExecutionRole.Arn
