services:
  web:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - intake-data:/data
    restart: unless-stopped
  worker:
    build: .
    command: ["python", "intake.py"]
    env_file: .env
    volumes:
      - intake-data:/data
    restart: unless-stopped
volumes:
  intake-data:
